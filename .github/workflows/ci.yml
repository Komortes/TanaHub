name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Core and native shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/TanaHub.Client/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install client dependencies
        run: npm ci
        working-directory: src/TanaHub.Client
      - name: Verify release versions and tooling
        run: |
          node scripts/check-release-version.mjs
          node --test scripts/tests/release.test.mjs scripts/tests/environment.test.mjs scripts/tests/updates.test.mjs
      - name: Restore
        run: dotnet restore TanaHub.sln
      - name: Format check
        run: dotnet format TanaHub.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build TanaHub.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test TanaHub.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
      - name: Build frontend
        run: npm run build
        working-directory: src/TanaHub.Client
      - name: Prepare and test self-contained core
        run: |
          npm run prepare:bridge
          npm run test:core
        working-directory: src/TanaHub.Client
      - name: Check native shell
        run: cargo +stable test --release --locked --manifest-path src/TanaHub.Client/src-tauri/Cargo.toml --lib
      - name: Coverage summary
        if: runner.os == 'Linux'
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:MarkdownSummaryGithub
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend and browser scenarios
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/TanaHub.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/TanaHub.Client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:transport
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-evidence
          path: ${{ runner.temp }}/tanahub-client-test-results
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

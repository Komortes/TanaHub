name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package ${{ matrix.rid }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            bundles: app,dmg
          - os: windows-latest
            rid: win-x64
            bundles: nsis
          - os: ubuntu-22.04
            rid: linux-x64
            bundles: deb,appimage
    defaults:
      run:
        working-directory: src/TanaHub.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/TanaHub.Client/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install client dependencies
        run: npm ci
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node ../../scripts/check-release-version.mjs "$RELEASE_TAG"
        shell: bash
      - name: Prepare self-contained core
        run: npm run prepare:bridge
      - name: Test packaged core
        run: npm run test:core
      - name: Build native installers
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect installers and checksums
        run: node ../../scripts/collect-release-assets.mjs ${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TanaHub-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/release/${{ matrix.rid }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  draft-release:
    name: Create draft prerelease
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: TanaHub-*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/release
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/${version}.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/tanahub-release-is-draft; then
            test "$(cat /tmp/tanahub-release-is-draft)" = true || { echo 'Refusing to replace a published release.'; exit 1; }
            gh release edit "$RELEASE_TAG" --title "TanaHub $version — Preview" --notes-file "$notes" --prerelease
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --draft --prerelease \
              --title "TanaHub $version — Preview" --notes-file "$notes"
          fi

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_draft:
        description: Create a version tag and draft after all checks and packages pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package ${{ matrix.rid }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            bundles: app,dmg
          - os: windows-latest
            rid: win-x64
            bundles: nsis
          - os: ubuntu-22.04
            rid: linux-x64
            bundles: deb,appimage
    defaults:
      run:
        working-directory: src/TanaHub.Client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/TanaHub.Client/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install client dependencies
        run: npm ci
      - name: Verify version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node ../../scripts/check-release-version.mjs "$RELEASE_TAG"
        shell: bash
      - name: Prepare self-contained core
        run: npm run prepare:bridge
      - name: Test packaged core
        run: npm run test:core
      - name: Build native installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node ../../scripts/build-release.mjs ${{ matrix.bundles }}
      - name: Collect installers and checksums
        run: node ../../scripts/collect-release-assets.mjs ${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TanaHub-${{ matrix.rid }}-${{ github.run_id }}
          path: artifacts/release/${{ matrix.rid }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  draft-release:
    name: Create draft prerelease
    if: github.ref_type == 'tag' || inputs.create_draft == true
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: TanaHub-*-${{ github.run_id }}
          merge-multiple: true
          path: artifacts/release
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if test -z "$RELEASE_TAG"; then
            RELEASE_TAG="v$(node -p "require('./src/TanaHub.Client/package.json').version")"
            node scripts/check-release-version.mjs "$RELEASE_TAG"
            if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /tmp/tanahub-tag-ref 2>/dev/null; then
              existing="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
              test "$existing" = "$GITHUB_SHA" || { echo 'Existing tag differs from the tested source; refusing to move it.'; exit 1; }
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
            fi
          fi
          version="${RELEASE_TAG#v}"
          notes="docs/releases/${version}.md"
          test -f "$notes"
          signatures=$(find artifacts/release -maxdepth 1 -name '*.sig' | wc -l)
          if test "$signatures" -eq 3; then
            node scripts/update-manifest.mjs artifacts/release "$RELEASE_TAG"
          else
            echo 'Update signatures are missing: sign all three packages locally and upload latest.json before publication.'
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/tanahub-release-is-draft; then
            if test "$(cat /tmp/tanahub-release-is-draft)" != true; then
              echo 'Release is already published; leaving its notes and assets unchanged.'
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --title "TanaHub $version — Preview" --notes-file "$notes" --prerelease
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/release/* --verify-tag --draft --prerelease \
              --title "TanaHub $version — Preview" --notes-file "$notes"
          fi

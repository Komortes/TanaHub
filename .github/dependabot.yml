version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dotnet:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /src/TanaHub.Client
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /src/TanaHub.Client/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      native:
        patterns: ['*']
